name: Verify package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pi-compatibility:
    name: Pi ${{ matrix.pi-version }} package compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pi-version:
          - '0.84.1'
          - '0.84.2'
          - '0.84.3'
          - '0.84.4'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install package dependencies
        run: npm ci --ignore-scripts

      - name: Install Pi ${{ matrix.pi-version }}
        run: |
          npm install \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            --legacy-peer-deps \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }}

      - name: Check package
        env:
          EXPECTED_PI_VERSION: ${{ matrix.pi-version }}
        run: npm run check

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for leaked credentials
        run: |
          if grep -rEn --exclude-dir=.git \
            'sk-ant-oat-[A-Za-z0-9_-]{20,}|CLAUDE_CODE_DEVICE_ID=[0-9a-f]{64}|CLAUDE_CODE_ACCOUNT_UUID=[0-9a-fA-F-]{36}' .; then
            echo "Potential credential or private identifier found" >&2
            exit 1
          fi
